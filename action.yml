---
name: BOSH Action
description: Run a workspace script in the official BOSH Docker CPI integration container.
author: Sebastian Heid

inputs:
  script:
    description: Path to an executable script in the checked-out workspace.
    required: true
  image:
    description: BOSH integration container image to run.
    required: false
    default: ghcr.io/cloudfoundry/bosh/docker-cpi@sha256:37b121239d691db644757de1a26e48e3a7839476963161703e6a5b8aef8e081e

runs:
  using: node24
  main: main.js

branding:
  icon: box
  color: blue
